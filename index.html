  --surface-2:#ffffff;
  --ink:#14251a;
  --muted:#667266;
  --line:#dfe5d8;
  --green:#1a7a3a;
  --green-dark:#0f5426;
  --green-soft:#e4f0e3;
  --gold:#e9b33b;
  --orange:#ef7a2b;
  --safe-area-inset-top: env(safe-area-inset-top, 0px);
}

@media (prefers-color-scheme: dark){
  :root{
    --surface:#111a13;
    --surface-2:#1a271f;
    --ink:#f2f4e9;
    --muted:#aab8aa;

*{
  box-sizing:border-box
}

html{
  scroll-behavior:smooth;
  overflow-y:auto
}

body{
  margin:0;
  background:var(--surface);
  color:var(--ink);
  font-family:Manrope,system-ui,sans-serif;
  overflow-y:auto;
  overflow-x:clip
}

button,input,select,textarea{
  font:inherit
}

button{
  cursor:pointer
}

.font-display{
  font-family:Fraunces,Georgia,serif
}

.card{
  background:var(--surface-2);
  border:1px solid var(--line);
  border-radius:20px;
  box-shadow:0 8px 28px rgba(20,37,26,.05)
}

.field{
  width:100%;
  border:1px solid var(--line);
  border-radius:10px;
  padding:9px 11px;
  background:var(--surface);
  color:var(--ink);
  outline:none;
  font-size:14px
}

.field:focus{
  border-color:var(--green);
  box-shadow:0 0 0 3px rgba(26,122,58,.13)
}

.label{
  font-size:12px;
  font-weight:800;
  letter-spacing:.04em;
  text-transform:uppercase;
  color:var(--muted);
  margin:0 0 7px
}

.chip{
  border:1px solid var(--line);
  background:var(--surface);
  border-radius:999px;
  padding:6px 10px;
  font-weight:700;
  font-size:12px
}

.chip.active{
  background:var(--green);
  color:#fff;
  border-color:var(--green)
}

.btn-primary{
  background:var(--green);
  color:white;
  border:0;
  border-radius:10px;
  padding:8px 12px;
  font-weight:800;
  font-size:13px;
  line-height:1.3
}

.btn-ghost{
  border:1px solid var(--line);
  background:var(--surface-2);
  color:var(--ink);
  border-radius:10px;
  padding:8px 12px;
  font-weight:800;
  font-size:13px;
  line-height:1.3
}

.btn-primary:disabled,.btn-ghost:disabled{
  opacity:.38;
  cursor:not-allowed
}

.nav-arrow{
  width:36px;
  height:36px;
  flex:0 0 36px;
  display:grid;
  place-items:center;
  border:1px solid var(--line);
  border-radius:10px;
  background:var(--surface-2);
  color:var(--ink);
  font-size:22px;
  font-weight:800;
  line-height:1;
  padding:0
}

.nav-arrow.next{
  background:var(--green);
  border-color:var(--green);
  color:#fff
}

.nav-arrow:disabled{
  opacity:.35;
  cursor:not-allowed
}

.range{
  width:100%;
  accent-color:var(--green)
}

.no-scrollbar::-webkit-scrollbar{
  display:none
}

.no-scrollbar{
  scrollbar-width:none
}

@keyframes unknownBlink{
  0%,100%{
    opacity:1
  }

  50%{
    opacity:.55
  }
}

.unknown-blink{
  animation:unknownBlink 1.1s ease-in-out infinite
}
